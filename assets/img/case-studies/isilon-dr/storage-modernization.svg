<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Legacy NAS to dual-cluster storage</title>
<desc id="desc">An aging NAS is replaced by matching four-node production and disaster recovery Isilon clusters.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07111f"/><stop offset="1" stop-color="#071d28"/>
  </linearGradient>
  <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
    <path d="M0 0 L14 7 L0 14 Z" fill="#8dffd0"/>
  </marker>
  <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
    <path d="M0 0 L14 7 L0 14 Z" fill="#ffb36b"/>
  </marker>
</defs>
<rect width="1600" height="820" rx="38" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="64" y="70" fill="#edf6ff" font-size="40" font-weight="800">Legacy NAS → resilient dual-cluster storage</text>
  <text x="64" y="112" fill="#9fb1c9" font-size="22">Four production nodes. Four recovery nodes. Separate operational paths.</text>

  <g transform="translate(75 220)">
    <rect width="300" height="340" rx="30" fill="#111c29" stroke="#657b91" stroke-width="4"/>
    <text x="150" y="58" fill="#edf6ff" font-size="28" font-weight="800" text-anchor="middle">Aging NAS</text>
    <rect x="65" y="110" width="170" height="100" rx="18" fill="#08111f" stroke="#718296" stroke-width="4"/>
    <circle cx="100" cy="145" r="8" fill="#ffd166"/><circle cx="130" cy="145" r="8" fill="#ff725e"/>
    <line x1="95" y1="181" x2="210" y2="181" stroke="#53687e" stroke-width="9"/>
    <text x="150" y="260" fill="#c7d5e8" font-size="20" text-anchor="middle">Aging platform</text>
    <text x="150" y="298" fill="#c7d5e8" font-size="20" text-anchor="middle">Capacity pressure</text>
  </g>

  <text x="472" y="295" fill="#8dffd0" font-size="22" font-weight="800" text-anchor="middle">Modernize</text>
  <path d="M400 390 H545" stroke="#8dffd0" stroke-width="10" marker-end="url(#arrowGreen)"/>

  <g transform="translate(585 175)">
    <rect width="395" height="430" rx="32" fill="#0c2034" stroke="#66e3ff" stroke-width="5"/>
    <text x="198" y="60" fill="#edf6ff" font-size="30" font-weight="800" text-anchor="middle">Production cluster</text>
    <text x="198" y="96" fill="#9fb1c9" font-size="20" text-anchor="middle">Four A300 nodes</text>
    <g transform="translate(55 130)">
      <g fill="#08111f" stroke="#66e3ff" stroke-width="4">
        <rect width="285" height="50" rx="13"/><rect y="65" width="285" height="50" rx="13"/>
        <rect y="130" width="285" height="50" rx="13"/><rect y="195" width="285" height="50" rx="13"/>
      </g>
      <g fill="#9bffcb"><circle cx="28" cy="25" r="7"/><circle cx="28" cy="90" r="7"/><circle cx="28" cy="155" r="7"/><circle cx="28" cy="220" r="7"/></g>
      <g fill="#dce9f6" font-size="19" font-weight="700">
        <text x="58" y="33">Node 1</text><text x="58" y="98">Node 2</text>
        <text x="58" y="163">Node 3</text><text x="58" y="228">Node 4</text>
      </g>
    </g>
    <text x="198" y="392" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">Live file services</text>
  </g>

  <text x="1048" y="295" fill="#ffb36b" font-size="22" font-weight="800" text-anchor="middle">SyncIQ</text>
  <path d="M980 390 H1115" stroke="#ffb36b" stroke-width="10" stroke-dasharray="16 12" marker-end="url(#arrowOrange)"/>

  <g transform="translate(1150 175)">
    <rect width="395" height="430" rx="32" fill="#10251f" stroke="#8dffd0" stroke-width="5"/>
    <text x="198" y="60" fill="#edf6ff" font-size="30" font-weight="800" text-anchor="middle">Recovery cluster</text>
    <text x="198" y="96" fill="#9fb1c9" font-size="20" text-anchor="middle">Four A300 nodes</text>
    <g transform="translate(55 130)">
      <g fill="#08111f" stroke="#8dffd0" stroke-width="4">
        <rect width="285" height="50" rx="13"/><rect y="65" width="285" height="50" rx="13"/>
        <rect y="130" width="285" height="50" rx="13"/><rect y="195" width="285" height="50" rx="13"/>
      </g>
      <g fill="#66e3ff"><circle cx="28" cy="25" r="7"/><circle cx="28" cy="90" r="7"/><circle cx="28" cy="155" r="7"/><circle cx="28" cy="220" r="7"/></g>
      <g fill="#dce9f6" font-size="19" font-weight="700">
        <text x="58" y="33">Node 1</text><text x="58" y="98">Node 2</text>
        <text x="58" y="163">Node 3</text><text x="58" y="228">Node 4</text>
      </g>
    </g>
    <text x="198" y="392" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">Recovery copy</text>
  </g>

  <g transform="translate(270 675)">
    <g><rect width="245" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="122" y="53" fill="#66e3ff" font-size="21" font-weight="800" text-anchor="middle">Management</text></g>
    <g transform="translate(270)"><rect width="245" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="122" y="53" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">Client data</text></g>
    <g transform="translate(540)"><rect width="245" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="122" y="53" fill="#ffb36b" font-size="21" font-weight="800" text-anchor="middle">Replication</text></g>
    <g transform="translate(810)"><rect width="245" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="122" y="53" fill="#ffd166" font-size="21" font-weight="800" text-anchor="middle">Protection</text></g>
  </g>
</g>
</svg>