<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
<title id="title">Legacy NAS to dual-cluster storage</title>
<desc id="desc">An aging NAS cluster is replaced by a four-node production Isilon cluster and matching four-node disaster recovery cluster with separate management, client, replication, and protection functions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#071c27"/></linearGradient>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 Z" fill="#8dffd0"/></marker>
</defs>
<rect width="1600" height="880" rx="38" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="64" y="72" fill="#edf6ff" font-size="40" font-weight="800">Legacy NAS → resilient dual-cluster storage</text>
  <text x="64" y="114" fill="#9fb1c9" font-size="22">A public-safe view of the architecture transition</text>

  <g transform="translate(70 210)">
    <rect width="300" height="355" rx="30" fill="#101a27" stroke="#62778c" stroke-width="4"/>
    <text x="150" y="58" fill="#edf6ff" font-size="27" font-weight="800" text-anchor="middle">Aging NAS</text>
    <rect x="64" y="112" width="172" height="104" rx="20" fill="#08111f" stroke="#718296" stroke-width="4"/>
    <circle cx="98" cy="148" r="8" fill="#ffd166"/><circle cx="126" cy="148" r="8" fill="#ff725e"/>
    <line x1="92" y1="184" x2="210" y2="184" stroke="#53687e" stroke-width="9"/>
    <text x="150" y="266" fill="#c7d5e8" font-size="20" text-anchor="middle">Aging platform</text>
    <text x="150" y="302" fill="#c7d5e8" font-size="20" text-anchor="middle">Capacity pressure</text>
    <text x="150" y="338" fill="#c7d5e8" font-size="20" text-anchor="middle">Limited recovery posture</text>
  </g>

  <path d="M405 388 H535" stroke="#8dffd0" stroke-width="10" marker-end="url(#arrow)"/>
  <text x="470" y="354" fill="#8dffd0" font-size="20" font-weight="800" text-anchor="middle">Modernize</text>

  <g transform="translate(570 175)">
    <rect width="405" height="435" rx="32" fill="#0c2034" stroke="#66e3ff" stroke-width="5"/>
    <text x="202" y="62" fill="#edf6ff" font-size="29" font-weight="800" text-anchor="middle">Production cluster</text>
    <text x="202" y="96" fill="#9fb1c9" font-size="20" text-anchor="middle">Four Dell Isilon A300 nodes</text>
    <g transform="translate(57 130)">
      <g fill="#08111f" stroke="#66e3ff" stroke-width="4">
        <rect width="290" height="52" rx="13"/><rect y="66" width="290" height="52" rx="13"/>
        <rect y="132" width="290" height="52" rx="13"/><rect y="198" width="290" height="52" rx="13"/>
      </g>
      <g fill="#9bffcb">
        <circle cx="30" cy="26" r="7"/><circle cx="30" cy="92" r="7"/><circle cx="30" cy="158" r="7"/><circle cx="30" cy="224" r="7"/>
      </g>
      <g fill="#d8e6f4" font-size="19" font-weight="700">
        <text x="62" y="34">Node 1</text><text x="62" y="100">Node 2</text>
        <text x="62" y="166">Node 3</text><text x="62" y="232">Node 4</text>
      </g>
    </g>
    <text x="202" y="399" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">Live SMB and application data</text>
  </g>

  <path d="M975 388 H1080" stroke="#ffb36b" stroke-width="9" stroke-dasharray="15 12" marker-end="url(#arrow)"/>
  <text x="1028" y="354" fill="#ffbf7e" font-size="20" font-weight="800" text-anchor="middle">SyncIQ</text>

  <g transform="translate(1115 175)">
    <rect width="405" height="435" rx="32" fill="#10251f" stroke="#8dffd0" stroke-width="5"/>
    <text x="202" y="62" fill="#edf6ff" font-size="29" font-weight="800" text-anchor="middle">Disaster recovery cluster</text>
    <text x="202" y="96" fill="#9fb1c9" font-size="20" text-anchor="middle">Four Dell Isilon A300 nodes</text>
    <g transform="translate(57 130)">
      <g fill="#08111f" stroke="#8dffd0" stroke-width="4">
        <rect width="290" height="52" rx="13"/><rect y="66" width="290" height="52" rx="13"/>
        <rect y="132" width="290" height="52" rx="13"/><rect y="198" width="290" height="52" rx="13"/>
      </g>
      <g fill="#66e3ff">
        <circle cx="30" cy="26" r="7"/><circle cx="30" cy="92" r="7"/><circle cx="30" cy="158" r="7"/><circle cx="30" cy="224" r="7"/>
      </g>
      <g fill="#d8e6f4" font-size="19" font-weight="700">
        <text x="62" y="34">Node 1</text><text x="62" y="100">Node 2</text>
        <text x="62" y="166">Node 3</text><text x="62" y="232">Node 4</text>
      </g>
    </g>
    <text x="202" y="399" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">Replicated recovery data</text>
  </g>

  <g transform="translate(350 680)">
    <g>
      <rect width="270" height="112" rx="22" fill="#0d1d34" stroke="#24425e"/>
      <text x="24" y="43" fill="#66e3ff" font-size="20" font-weight="800">Management</text>
      <text x="24" y="76" fill="#c7d5e8" font-size="17">Administration and health</text>
    </g>
    <g transform="translate(292)">
      <rect width="270" height="112" rx="22" fill="#0d1d34" stroke="#24425e"/>
      <text x="24" y="43" fill="#8dffd0" font-size="20" font-weight="800">Client data</text>
      <text x="24" y="76" fill="#c7d5e8" font-size="17">SmartConnect and SMB access</text>
    </g>
    <g transform="translate(584)">
      <rect width="270" height="112" rx="22" fill="#0d1d34" stroke="#24425e"/>
      <text x="24" y="43" fill="#ffb36b" font-size="20" font-weight="800">Replication</text>
      <text x="24" y="76" fill="#c7d5e8" font-size="17">Dedicated inter-cluster path</text>
    </g>
    <g transform="translate(876)">
      <rect width="270" height="112" rx="22" fill="#0d1d34" stroke="#24425e"/>
      <text x="24" y="43" fill="#ffd166" font-size="20" font-weight="800">Protection</text>
      <text x="24" y="76" fill="#c7d5e8" font-size="17">Snapshots, DR, monitoring</text>
    </g>
  </g>
</g>
</svg>