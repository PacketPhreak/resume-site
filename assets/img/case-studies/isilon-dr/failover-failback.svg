<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
<title id="title">Manual failover and failback fallback</title>
<desc id="desc">A seven-stage recovery workflow protects consistency while promoting the recovery cluster, changing DNS, validating service, reversing replication, and returning service to normal.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1826"/></linearGradient>
</defs>
<rect width="1600" height="880" rx="38" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="64" y="72" fill="#edf6ff" font-size="40" font-weight="800">Manual failover and failback fallback</text>
  <text x="64" y="114" fill="#9fb1c9" font-size="22">The documented path when automated orchestration is unavailable</text>

  <line x1="145" y1="390" x2="1455" y2="390" stroke="#35566f" stroke-width="9"/>

  <g font-weight="800" text-anchor="middle">
    <g transform="translate(145 390)"><circle r="54" fill="#08111f" stroke="#ff806f" stroke-width="6"/><text y="10" fill="#edf6ff" font-size="30">1</text><text y="-105" fill="#edf6ff" font-size="20">Detect</text><text y="-72" fill="#9fb1c9" font-size="16">alert / outage</text></g>
    <g transform="translate(365 390)"><circle r="54" fill="#08111f" stroke="#ffd166" stroke-width="6"/><text y="10" fill="#edf6ff" font-size="30">2</text><text y="-105" fill="#edf6ff" font-size="20">Freeze writes</text><text y="-72" fill="#9fb1c9" font-size="16">protect consistency</text></g>
    <g transform="translate(585 390)"><circle r="54" fill="#08111f" stroke="#66e3ff" stroke-width="6"/><text y="10" fill="#edf6ff" font-size="30">3</text><text y="-105" fill="#edf6ff" font-size="20">Promote DR</text><text y="-72" fill="#9fb1c9" font-size="16">allow target writes</text></g>
    <g transform="translate(805 390)"><circle r="54" fill="#08111f" stroke="#8dffd0" stroke-width="6"/><text y="10" fill="#edf6ff" font-size="30">4</text><text y="-105" fill="#edf6ff" font-size="20">Shift DNS</text><text y="-72" fill="#9fb1c9" font-size="16">redirect clients</text></g>
    <g transform="translate(1025 390)"><circle r="54" fill="#08111f" stroke="#8dffd0" stroke-width="6"/><text y="10" fill="#edf6ff" font-size="30">5</text><text y="-105" fill="#edf6ff" font-size="20">Validate</text><text y="-72" fill="#9fb1c9" font-size="16">SMB and apps</text></g>
    <g transform="translate(1245 390)"><circle r="54" fill="#08111f" stroke="#ffb36b" stroke-width="6"/><text y="10" fill="#edf6ff" font-size="30">6</text><text y="-105" fill="#edf6ff" font-size="20">Reverse sync</text><text y="-72" fill="#9fb1c9" font-size="16">prepare source</text></g>
    <g transform="translate(1455 390)"><circle r="54" fill="#08111f" stroke="#66e3ff" stroke-width="6"/><text y="10" fill="#edf6ff" font-size="30">7</text><text y="-105" fill="#edf6ff" font-size="20">Fail back</text><text y="-72" fill="#9fb1c9" font-size="16">restore normal flow</text></g>
  </g>

  <g transform="translate(85 565)">
    <rect width="1430" height="210" rx="28" fill="#0b1829" stroke="#24425e"/>
    <text x="34" y="49" fill="#edf6ff" font-size="25" font-weight="800">Operational guardrails</text>
    <g fill="#c7d5e8" font-size="19">
      <text x="34" y="94">• Prevent the failed source from accepting writes before the target is promoted.</text>
      <text x="34" y="134">• Validate SMB and application access before changing user-facing DNS.</text>
      <text x="34" y="174">• Block writes during reverse synchronization and controlled failback.</text>
      <text x="770" y="94">• Redirect hard-coded application paths when DNS alone is not enough.</text>
      <text x="770" y="134">• Restore normal DNS and application references only when the source is ready.</text>
      <text x="770" y="174">• Confirm normal replication resumes after failback.</text>
    </g>
  </g>
</g>
</svg>