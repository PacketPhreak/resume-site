<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Manual failover and failback fallback</title>
<desc id="desc">Seven recovery stages protect data consistency and restore normal service.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1826"/></linearGradient>
</defs>
<rect width="1600" height="820" rx="38" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="64" y="70" fill="#edf6ff" font-size="40" font-weight="800">Manual failover and failback fallback</text>
  <text x="64" y="112" fill="#9fb1c9" font-size="22">The documented path when the easy button is unavailable.</text>

  <line x1="145" y1="365" x2="1455" y2="365" stroke="#35566f" stroke-width="9"/>

  <g font-weight="800" text-anchor="middle">
    <g transform="translate(145 365)"><circle r="55" fill="#08111f" stroke="#ff806f" stroke-width="6"/><text y="11" fill="#edf6ff" font-size="30">1</text><text y="-105" fill="#edf6ff" font-size="20">Detect</text><text y="-73" fill="#9fb1c9" font-size="16">Outage</text></g>
    <g transform="translate(365 365)"><circle r="55" fill="#08111f" stroke="#ffd166" stroke-width="6"/><text y="11" fill="#edf6ff" font-size="30">2</text><text y="-105" fill="#edf6ff" font-size="20">Freeze writes</text><text y="-73" fill="#9fb1c9" font-size="16">Protect consistency</text></g>
    <g transform="translate(585 365)"><circle r="55" fill="#08111f" stroke="#66e3ff" stroke-width="6"/><text y="11" fill="#edf6ff" font-size="30">3</text><text y="-105" fill="#edf6ff" font-size="20">Promote DR</text><text y="-73" fill="#9fb1c9" font-size="16">Enable target</text></g>
    <g transform="translate(805 365)"><circle r="55" fill="#08111f" stroke="#8dffd0" stroke-width="6"/><text y="11" fill="#edf6ff" font-size="30">4</text><text y="-105" fill="#edf6ff" font-size="20">Shift DNS</text><text y="-73" fill="#9fb1c9" font-size="16">Redirect clients</text></g>
    <g transform="translate(1025 365)"><circle r="55" fill="#08111f" stroke="#8dffd0" stroke-width="6"/><text y="11" fill="#edf6ff" font-size="30">5</text><text y="-105" fill="#edf6ff" font-size="20">Validate</text><text y="-73" fill="#9fb1c9" font-size="16">SMB and apps</text></g>
    <g transform="translate(1245 365)"><circle r="55" fill="#08111f" stroke="#ffb36b" stroke-width="6"/><text y="11" fill="#edf6ff" font-size="30">6</text><text y="-105" fill="#edf6ff" font-size="20">Reverse sync</text><text y="-73" fill="#9fb1c9" font-size="16">Prepare source</text></g>
    <g transform="translate(1455 365)"><circle r="55" fill="#08111f" stroke="#66e3ff" stroke-width="6"/><text y="11" fill="#edf6ff" font-size="30">7</text><text y="-105" fill="#edf6ff" font-size="20">Fail back</text><text y="-73" fill="#9fb1c9" font-size="16">Restore service</text></g>
  </g>

  <g transform="translate(110 555)">
    <rect width="1380" height="175" rx="28" fill="#0b1829" stroke="#24425e"/>
    <text x="38" y="48" fill="#edf6ff" font-size="25" font-weight="800">Recovery guardrails</text>
    <text x="38" y="93" fill="#c7d5e8" font-size="19">• Stop writes before promoting the recovery target.</text>
    <text x="38" y="132" fill="#c7d5e8" font-size="19">• Validate client and application access before DNS cutover.</text>
    <text x="745" y="93" fill="#c7d5e8" font-size="19">• Control writes during reverse synchronization.</text>
    <text x="745" y="132" fill="#c7d5e8" font-size="19">• Confirm normal replication after failback.</text>
  </g>
</g>
</svg>