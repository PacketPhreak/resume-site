<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Manual failover and failback workflow</title>
<desc id="desc">A seven-step operational workflow covers alerting, write protection, promoting the recovery cluster, DNS cutover, validation, reverse synchronization, and controlled failback.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="1" stop-color="#0a1826"/>
  </linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#8dffd0"/>
  </marker>
</defs>
<rect width="1400" height="760" rx="34" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="58" y="66" fill="#edf6ff" font-size="34" font-weight="800">Manual failover and failback fallback</text>
  <text x="58" y="103" fill="#9fb1c9" font-size="19">The documented recovery path when automated orchestration is unavailable</text>

  <path d="M125 320 H1275" stroke="#35566f" stroke-width="7"/>

  <g>
    <g transform="translate(65 180)">
      <circle cx="70" cy="140" r="50" fill="#08111f" stroke="#ff806f" stroke-width="5"/>
      <text x="70" y="148" fill="#edf6ff" font-size="26" font-weight="900" text-anchor="middle">1</text>
      <text x="70" y="42" fill="#edf6ff" font-size="19" font-weight="800" text-anchor="middle">Detect</text>
      <text x="70" y="70" fill="#9fb1c9" font-size="15" text-anchor="middle">alert / outage</text>
    </g>
    <g transform="translate(250 180)">
      <circle cx="70" cy="140" r="50" fill="#08111f" stroke="#ffd166" stroke-width="5"/>
      <text x="70" y="148" fill="#edf6ff" font-size="26" font-weight="900" text-anchor="middle">2</text>
      <text x="70" y="42" fill="#edf6ff" font-size="19" font-weight="800" text-anchor="middle">Freeze writes</text>
      <text x="70" y="70" fill="#9fb1c9" font-size="15" text-anchor="middle">protect consistency</text>
    </g>
    <g transform="translate(435 180)">
      <circle cx="70" cy="140" r="50" fill="#08111f" stroke="#66e3ff" stroke-width="5"/>
      <text x="70" y="148" fill="#edf6ff" font-size="26" font-weight="900" text-anchor="middle">3</text>
      <text x="70" y="42" fill="#edf6ff" font-size="19" font-weight="800" text-anchor="middle">Promote DR</text>
      <text x="70" y="70" fill="#9fb1c9" font-size="15" text-anchor="middle">allow target writes</text>
    </g>
    <g transform="translate(620 180)">
      <circle cx="70" cy="140" r="50" fill="#08111f" stroke="#8dffd0" stroke-width="5"/>
      <text x="70" y="148" fill="#edf6ff" font-size="26" font-weight="900" text-anchor="middle">4</text>
      <text x="70" y="42" fill="#edf6ff" font-size="19" font-weight="800" text-anchor="middle">Shift DNS</text>
      <text x="70" y="70" fill="#9fb1c9" font-size="15" text-anchor="middle">redirect clients</text>
    </g>
    <g transform="translate(805 180)">
      <circle cx="70" cy="140" r="50" fill="#08111f" stroke="#8dffd0" stroke-width="5"/>
      <text x="70" y="148" fill="#edf6ff" font-size="26" font-weight="900" text-anchor="middle">5</text>
      <text x="70" y="42" fill="#edf6ff" font-size="19" font-weight="800" text-anchor="middle">Validate</text>
      <text x="70" y="70" fill="#9fb1c9" font-size="15" text-anchor="middle">SMB and apps</text>
    </g>
    <g transform="translate(990 180)">
      <circle cx="70" cy="140" r="50" fill="#08111f" stroke="#ffb36b" stroke-width="5"/>
      <text x="70" y="148" fill="#edf6ff" font-size="26" font-weight="900" text-anchor="middle">6</text>
      <text x="70" y="42" fill="#edf6ff" font-size="19" font-weight="800" text-anchor="middle">Reverse sync</text>
      <text x="70" y="70" fill="#9fb1c9" font-size="15" text-anchor="middle">prepare source</text>
    </g>
    <g transform="translate(1175 180)">
      <circle cx="70" cy="140" r="50" fill="#08111f" stroke="#66e3ff" stroke-width="5"/>
      <text x="70" y="148" fill="#edf6ff" font-size="26" font-weight="900" text-anchor="middle">7</text>
      <text x="70" y="42" fill="#edf6ff" font-size="19" font-weight="800" text-anchor="middle">Fail back</text>
      <text x="70" y="70" fill="#9fb1c9" font-size="15" text-anchor="middle">restore normal flow</text>
    </g>
  </g>

  <g transform="translate(70 485)">
    <rect width="1260" height="176" rx="26" fill="#0b1829" stroke="#24425e"/>
    <text x="34" y="43" fill="#edf6ff" font-size="22" font-weight="800">Operational guardrails</text>
    <g fill="#c7d5e8" font-size="17">
      <text x="34" y="82">• Ensure the failed source cannot accept writes before promoting the target.</text>
      <text x="34" y="114">• Validate access on the recovery cluster before changing user-facing DNS.</text>
      <text x="34" y="146">• Block client writes during reverse synchronization and controlled failback.</text>
      <text x="680" y="82">• Redirect hard-coded application references when DNS alone is insufficient.</text>
      <text x="680" y="114">• Restore DNS and application references only after the source is ready.</text>
      <text x="680" y="146">• Confirm normal replication resumes after failback.</text>
    </g>
  </g>
</g>
</svg>