<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Client access, protection, and replication</title>
<desc id="desc">Users connect through SmartConnect to the production cluster while SyncIQ replicates data to the recovery cluster.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07111f"/><stop offset="1" stop-color="#071d28"/>
  </linearGradient>
  <marker id="cyanArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#66e3ff"/></marker>
  <marker id="greenArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#8dffd0"/></marker>
</defs>
<rect width="1600" height="820" rx="38" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="64" y="70" fill="#edf6ff" font-size="40" font-weight="800">Client access, protection, and replication</text>
  <text x="64" y="112" fill="#9fb1c9" font-size="22">Simple paths make the recovery story easier to operate and explain.</text>

  <g transform="translate(65 260)">
    <rect width="290" height="205" rx="30" fill="#0d1d34" stroke="#66e3ff" stroke-width="4"/>
    <text x="145" y="70" fill="#edf6ff" font-size="28" font-weight="800" text-anchor="middle">Users &amp; apps</text>
    <text x="145" y="118" fill="#c7d5e8" font-size="20" text-anchor="middle">SMB shares</text>
    <text x="145" y="154" fill="#c7d5e8" font-size="20" text-anchor="middle">Business workflows</text>
  </g>

  <text x="460" y="280" fill="#66e3ff" font-size="21" font-weight="800" text-anchor="middle">SmartConnect</text>
  <path d="M355 365 H535" stroke="#66e3ff" stroke-width="10" marker-end="url(#cyanArrow)"/>

  <g transform="translate(575 190)">
    <rect width="390" height="410" rx="32" fill="#0c2034" stroke="#66e3ff" stroke-width="5"/>
    <text x="195" y="62" fill="#edf6ff" font-size="30" font-weight="800" text-anchor="middle">Primary cluster</text>
    <g transform="translate(52 115)">
      <g fill="#08111f" stroke="#66e3ff" stroke-width="4">
        <rect width="286" height="50" rx="13"/><rect y="65" width="286" height="50" rx="13"/>
        <rect y="130" width="286" height="50" rx="13"/><rect y="195" width="286" height="50" rx="13"/>
      </g>
    </g>
    <text x="195" y="374" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">Live production data</text>
  </g>

  <text x="1040" y="280" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">SyncIQ</text>
  <path d="M965 365 H1110" stroke="#8dffd0" stroke-width="10" stroke-dasharray="16 12" marker-end="url(#greenArrow)"/>

  <g transform="translate(1150 190)">
    <rect width="390" height="410" rx="32" fill="#10251f" stroke="#8dffd0" stroke-width="5"/>
    <text x="195" y="62" fill="#edf6ff" font-size="30" font-weight="800" text-anchor="middle">DR cluster</text>
    <g transform="translate(52 115)">
      <g fill="#08111f" stroke="#8dffd0" stroke-width="4">
        <rect width="286" height="50" rx="13"/><rect y="65" width="286" height="50" rx="13"/>
        <rect y="130" width="286" height="50" rx="13"/><rect y="195" width="286" height="50" rx="13"/>
      </g>
    </g>
    <text x="195" y="374" fill="#8dffd0" font-size="21" font-weight="800" text-anchor="middle">Recovery copy</text>
  </g>

  <g transform="translate(145 680)">
    <g><rect width="280" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="140" y="40" fill="#edf6ff" font-size="21" font-weight="800" text-anchor="middle">SnapshotIQ</text><text x="140" y="67" fill="#9fb1c9" font-size="16" text-anchor="middle">Point-in-time recovery</text></g>
    <g transform="translate(315)"><rect width="280" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="140" y="40" fill="#edf6ff" font-size="21" font-weight="800" text-anchor="middle">InsightIQ</text><text x="140" y="67" fill="#9fb1c9" font-size="16" text-anchor="middle">Health and capacity</text></g>
    <g transform="translate(630)"><rect width="280" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="140" y="40" fill="#edf6ff" font-size="21" font-weight="800" text-anchor="middle">Eyeglass DR</text><text x="140" y="67" fill="#9fb1c9" font-size="16" text-anchor="middle">Failover orchestration</text></g>
    <g transform="translate(945)"><rect width="365" height="88" rx="20" fill="#0d1d34" stroke="#24425e"/><text x="182" y="40" fill="#edf6ff" font-size="21" font-weight="800" text-anchor="middle">Ransomware Defender</text><text x="182" y="67" fill="#9fb1c9" font-size="16" text-anchor="middle">File-event and behavior analytics</text></g>
  </g>
</g>
</svg>