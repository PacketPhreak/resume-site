<svg xmlns="http://www.w3.org/2000/svg" width="980" height="82" viewBox="0 0 980 82" role="img" aria-label="How to add archive material later">
  <style>
    @keyframes flickerMain {
      0%, 16%, 19%, 23%, 52%, 58%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 3px #FFFFFF) drop-shadow(0 0 9px rgba(255,255,255,.68));
      }
      17%, 20%, 55%, 57%, 88%, 92% {
        opacity: .28;
        filter: none;
      }
    }

    @keyframes flickerSpecial {
      0%, 10%, 14%, 32%, 45%, 67%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 4px #EB0028) drop-shadow(0 0 13px #EB0028);
      }
      11%, 13%, 33%, 46%, 70%, 72%, 90% {
        opacity: .18;
        filter: none;
      }
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 30px;
      font-weight: 800;
      dominant-baseline: middle;
    }

    .main {
      fill: #FFFFFF;
      animation: flickerMain 4.2s infinite;
    }

    .special {
      fill: #EB0028;
      font-weight: 900;
      animation: flickerSpecial 2.7s infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .main, .special {
        animation: none;
      }
    }
  </style>

  <text x="4" y="42.0"><tspan class="main">How to add archive material later</tspan></text>
</svg>
