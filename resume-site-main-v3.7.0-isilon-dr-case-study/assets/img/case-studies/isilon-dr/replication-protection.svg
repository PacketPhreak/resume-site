<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Production and disaster recovery data flow</title>
<desc id="desc">Client SMB traffic enters the production cluster through SmartConnect, while SyncIQ replicates protected data to a disaster recovery cluster monitored by InsightIQ and Superna services.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="1" stop-color="#071b25"/>
  </linearGradient>
  <marker id="cyanArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#66e3ff"/>
  </marker>
  <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#8dffd0"/>
  </marker>
</defs>
<rect width="1400" height="720" rx="34" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="58" y="66" fill="#edf6ff" font-size="34" font-weight="800">Client access, protection, and replication</text>
  <text x="58" y="103" fill="#9fb1c9" font-size="19">How the platform separated user traffic from administration and recovery data movement</text>

  <g transform="translate(55 185)">
    <rect width="245" height="170" rx="26" fill="#0d1d34" stroke="#66e3ff" stroke-width="3"/>
    <text x="122" y="52" fill="#edf6ff" font-size="23" font-weight="800" text-anchor="middle">Users &amp; apps</text>
    <text x="122" y="91" fill="#c7d5e8" font-size="17" text-anchor="middle">SMB shares</text>
    <text x="122" y="120" fill="#c7d5e8" font-size="17" text-anchor="middle">Business workflows</text>
  </g>

  <path d="M300 270 H430" stroke="#66e3ff" stroke-width="8" marker-end="url(#cyanArrow)"/>
  <text x="365" y="246" fill="#66e3ff" font-size="17" font-weight="800" text-anchor="middle">SmartConnect / DNS</text>

  <g transform="translate(450 145)">
    <rect width="360" height="330" rx="30" fill="#0c2034" stroke="#66e3ff" stroke-width="4"/>
    <text x="180" y="50" fill="#edf6ff" font-size="25" font-weight="800" text-anchor="middle">Primary A300 cluster</text>
    <g transform="translate(50 90)" fill="#08111f" stroke="#66e3ff" stroke-width="3">
      <rect width="260" height="43" rx="11"/>
      <rect y="53" width="260" height="43" rx="11"/>
      <rect y="106" width="260" height="43" rx="11"/>
      <rect y="159" width="260" height="43" rx="11"/>
    </g>
    <text x="180" y="294" fill="#8dffd0" font-size="18" font-weight="800" text-anchor="middle">Live production data</text>
  </g>

  <path d="M810 310 H965" stroke="#8dffd0" stroke-width="8" stroke-dasharray="14 10" marker-end="url(#greenArrow)"/>
  <text x="888" y="283" fill="#8dffd0" font-size="18" font-weight="800" text-anchor="middle">SyncIQ</text>
  <text x="888" y="339" fill="#9fb1c9" font-size="16" text-anchor="middle">asynchronous replication</text>

  <g transform="translate(985 145)">
    <rect width="360" height="330" rx="30" fill="#10251f" stroke="#8dffd0" stroke-width="4"/>
    <text x="180" y="50" fill="#edf6ff" font-size="25" font-weight="800" text-anchor="middle">DR A300 cluster</text>
    <g transform="translate(50 90)" fill="#08111f" stroke="#8dffd0" stroke-width="3">
      <rect width="260" height="43" rx="11"/>
      <rect y="53" width="260" height="43" rx="11"/>
      <rect y="106" width="260" height="43" rx="11"/>
      <rect y="159" width="260" height="43" rx="11"/>
    </g>
    <text x="180" y="294" fill="#8dffd0" font-size="18" font-weight="800" text-anchor="middle">Recovery copy</text>
  </g>

  <g transform="translate(300 545)">
    <rect width="800" height="110" rx="24" fill="#0b1829" stroke="#24425e"/>
    <g fill="#edf6ff" font-size="18" font-weight="800">
      <text x="40" y="43">SnapshotIQ</text>
      <text x="235" y="43">InsightIQ</text>
      <text x="405" y="43">Eyeglass DR</text>
      <text x="595" y="43">Ransomware Defender</text>
    </g>
    <g fill="#9fb1c9" font-size="15">
      <text x="40" y="72">point-in-time protection</text>
      <text x="235" y="72">capacity and health visibility</text>
      <text x="405" y="72">failover orchestration</text>
      <text x="595" y="72">behavior and event analytics</text>
    </g>
  </g>

  <path d="M630 475 V545" stroke="#ffb36b" stroke-width="5"/>
  <path d="M1165 475 V545 H1080" stroke="#ffb36b" stroke-width="5"/>
</g>
</svg>