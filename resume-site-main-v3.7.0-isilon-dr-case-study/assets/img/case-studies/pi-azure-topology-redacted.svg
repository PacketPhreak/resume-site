<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Redacted cloud-side topology</title>
<desc id="desc">A simplified cloud topology with manufacturing egress, a core hub, supporting segments, and three endpoint groups.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08111f"/>
    <stop offset="1" stop-color="#071825"/>
  </linearGradient>
</defs>
<rect width="1400" height="720" rx="34" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="58" y="64" fill="#e8f1ff" font-size="34" font-weight="800">Redacted cloud-side topology</text>
  <text x="58" y="100" fill="#9fb1c9" font-size="19">Simplified virtual WAN / hub view used to validate routing context and supporting segments</text>

  <g stroke="#8da2bf" stroke-width="5" fill="none">
    <path d="M215 360 H400"/>
    <path d="M540 360 C650 360 675 205 780 205"/>
    <path d="M540 360 H780"/>
    <path d="M540 360 C650 360 675 515 780 515"/>
    <path d="M980 205 H1085"/>
    <path d="M980 360 H1085"/>
    <path d="M980 515 H1085"/>
  </g>

  <g>
    <circle cx="160" cy="360" r="36" fill="#08111f" stroke="#66e3ff" stroke-width="5"/>
    <text x="160" y="418" fill="#c7d5e8" font-size="18" text-anchor="middle">Manufacturing</text>
    <text x="160" y="442" fill="#c7d5e8" font-size="18" text-anchor="middle">egress</text>

    <rect x="400" y="310" width="140" height="100" rx="22" fill="#0c2135" stroke="#66e3ff" stroke-width="5"/>
    <text x="470" y="350" fill="#e8f1ff" font-size="20" font-weight="800" text-anchor="middle">Core hub</text>
    <text x="470" y="380" fill="#9fb1c9" font-size="16" text-anchor="middle">routing context</text>

    <g fill="#0c2135" stroke="#e8f1ff" stroke-width="4">
      <rect x="780" y="160" width="200" height="90" rx="20"/>
      <rect x="780" y="315" width="200" height="90" rx="20"/>
      <rect x="780" y="470" width="200" height="90" rx="20"/>
    </g>
    <g fill="#e8f1ff" font-size="19" font-weight="800" text-anchor="middle">
      <text x="880" y="198">Analytics segment</text>
      <text x="880" y="353">Shared services</text>
      <text x="880" y="508">Security / return path</text>
    </g>
    <g fill="#9fb1c9" font-size="15" text-anchor="middle">
      <text x="880" y="224">cloud application path</text>
      <text x="880" y="379">supporting resources</text>
      <text x="880" y="534">policy boundary context</text>
    </g>

    <g fill="#103923" stroke="#8cffc7" stroke-width="5">
      <circle cx="1135" cy="205" r="30"/>
      <circle cx="1135" cy="360" r="30"/>
      <circle cx="1135" cy="515" r="30"/>
    </g>
    <g fill="#e8f1ff" font-size="18" font-weight="700">
      <text x="1180" y="212">Endpoint group A</text>
      <text x="1180" y="367">Endpoint group B</text>
      <text x="1180" y="512">Observability</text>
      <text x="1180" y="536">diagnostics</text>
    </g>
  </g>

  <g transform="translate(58 612)">
    <rect width="940" height="66" rx="18" fill="#0d1d34" stroke="#203d62"/>
    <text x="24" y="29" fill="#c7d5e8" font-size="17">The topology review distinguished “cloud reachable” from “end-to-end functional.”</text>
    <text x="24" y="53" fill="#9fb1c9" font-size="16">It also clarified which boundary allowed outbound flow and which boundary shaped return traffic.</text>
  </g>
</g>
</svg>